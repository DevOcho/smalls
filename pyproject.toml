[tool.poetry]
name = "smalls"
version = "0.1.0"
description = "Python Peewee Database Aid - Migration / Rollback, Init, Seed, and Status"
authors = ["Kenny Pyatt <kenny.pyatt@gmail.com>"]
license = "LICENSE"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.3.1"
rich = "^14.2.0"
peewee = "^3.17.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.0"
pylint = "^3.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
